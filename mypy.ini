[mypy]
python_version = 3.11
ignore_missing_imports = True
check_untyped_defs = True
disable_error_code = import-untyped, override, union-attr, var-annotated, return-value, arg-type, attr-defined, no-untyped-def, comparison-overlap, no-any-return

[mypy-screensense.core.*]
strict = True
disallow_untyped_defs = True
